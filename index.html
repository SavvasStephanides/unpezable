<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2093f6">
    <title>Unpezable Games - Παιχνίθκια με Κυπριακή ψυσιή</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="" />
            <h1>Unpezable Games</h1>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="tagline">
                ΠΑΙΧΝΙΘΚΙΑ ΜΕ ΚΥΠΡΙΑΚΗ ΨΥΣΙΗ!
            </div>    
            <div class="bg"></div>
        </section>

        <section class="games">
            <h2>Τα Παιχνίθκια μας</h2>

            <ul>
                <li>
                    <a href="/">
                        <div class="icon">
                            <img src="xorkaton.png" alt="">
                        </div>
                        <h3 class="name">Χώρκατον</h3>
                        <p class="description">Ένα ενδιαφέρον παιχνίδι</p>
                    </a>
                </li>

                <li>
                    <a href="/">
                        <div class="icon">
                            <img src="evretifrasi.png" alt="">
                        </div>
                        <h3 class="name">Έβρε τη φράση</h3>
                        <p class="description">Ένα ενδιαφέρον παιχνίδι</p>
                    </a>
                </li>

                <li>
                    <a href="/">
                        <div class="icon">
                            <img src="pouentouton.png" alt="">
                        </div>
                        <h3 class="name">Πού εν τούτον;</h3>
                        <p class="description">Ένα ενδιαφέρον παιχνίδι</p>
                    </a>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
